[package]
name = "aail"
version = "0.1.0"
description = "AAIL - a host for scheduled, permission-scoped assistant roles"
authors = ["wenbuer"]
edition = "2021"

[lib]
name = "aail_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
