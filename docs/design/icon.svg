<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fe9ff"/><stop offset="0.22" stop-color="#c3b0ff"/>
      <stop offset="0.45" stop-color="#ff9ede"/><stop offset="0.68" stop-color="#ffe6a8"/>
      <stop offset="0.86" stop-color="#9ff2d2"/><stop offset="1" stop-color="#8fe9ff"/>
    </linearGradient>
    <linearGradient id="holo2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9f4"/><stop offset="0.3" stop-color="#a8e8ff"/>
      <stop offset="0.6" stop-color="#d3c4ff"/><stop offset="0.85" stop-color="#b6f5e0"/>
      <stop offset="1" stop-color="#ffe9b8"/>
    </linearGradient>
    <radialGradient id="pearl" cx="0.42" cy="0.38" r="0.68">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#dcd0ff" stop-opacity="0.75"/>
    </radialGradient>
    <filter id="ink" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="3" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="52" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wash" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>
  <g filter="url(#wash)" opacity="0.55">
    <circle cx="400" cy="380" r="190" fill="url(#holo)"/>
    <circle cx="640" cy="410" r="180" fill="url(#holo2)"/>
    <circle cx="520" cy="650" r="195" fill="url(#holo)"/>
  </g>
  <g filter="url(#ink)">
    <circle cx="400" cy="380" r="168" fill="url(#holo)" opacity="0.9"/>
    <circle cx="640" cy="410" r="158" fill="url(#holo2)" opacity="0.85"/>
    <circle cx="520" cy="650" r="172" fill="url(#holo)" opacity="0.85"/>
  </g>
  <circle cx="520" cy="500" r="92" fill="url(#pearl)"/>
</svg>
